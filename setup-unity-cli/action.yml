name: Setup Unity CLI
description: >
  Installs the official Unity CLI (https://docs.unity.com/en-us/unity-cli),
  uses it to install the requested Unity Editor version, and locates the
  resulting Unity executable.

inputs:
  unity-version:
    description: "Unity version to install (e.g. lts, 6000.3.20f1)"
    required: false
    default: "lts"
  cli-version:
    description: "Unity CLI version to install (default: latest from manifest)"
    required: false
    default: ""
  cli-channel:
    description: "Unity CLI release channel: alpha, beta, or empty for stable"
    required: false
    default: "beta"

outputs:
  editor-path:
    description: "Absolute path to the installed Unity executable"
    value: ${{ steps.locate.outputs.path }}

runs:
  using: composite
  steps:
    - name: Install Rosetta 2 (macOS arm64)
      if: runner.os == 'macOS' && runner.arch == 'ARM64'
      shell: bash
      run: softwareupdate --install-rosetta --agree-to-license

    - name: Install Unity CLI (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        UNITY_CLI_VERSION: ${{ inputs.cli-version }}
        UNITY_CLI_CHANNEL: ${{ inputs.cli-channel }}
      run: curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | bash

    - name: Install Unity CLI (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        UNITY_CLI_CHANNEL: ${{ inputs.cli-channel }}
      run: |
        $target = "${{ inputs.cli-version }}"
        if (-not $target) { $target = "latest" }
        $installerPath = Join-Path $env:RUNNER_TEMP "unity-cli-install.ps1"
        Invoke-WebRequest -UseBasicParsing -Uri https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.ps1 -OutFile $installerPath
        & $installerPath -Target $target

    - name: Install Unity Editor
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          export PATH="$(cygpath "$LOCALAPPDATA")/Unity/bin:$PATH"
        else
          export PATH="$HOME/.unity/bin:$PATH"
        fi
        unity install "${{ inputs.unity-version }}" -y --accept-eula --non-interactive

    - name: Locate installed Unity executable
      id: locate
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          export PATH="$(cygpath "$LOCALAPPDATA")/Unity/bin:$PATH"
        else
          export PATH="$HOME/.unity/bin:$PATH"
        fi
        install_root=$(unity install-path </dev/null)
        echo "install_root=$install_root"
        if [ "$RUNNER_OS" = "macOS" ]; then
          editor_path=$(find "$install_root" -maxdepth 4 -type d -name "Unity.app" -exec test -f "{}/Contents/MacOS/Unity" \; -print | head -1)
          [ -n "$editor_path" ] && editor_path="$editor_path/Contents/MacOS/Unity"
        else
          editor_path=$(find "$install_root" -maxdepth 3 -type f -name "Unity*" | head -1)
        fi
        if [ -z "$editor_path" ]; then
          echo "Could not find an installed Unity executable under $install_root" >&2
          exit 1
        fi
        echo "path=$editor_path" >> "$GITHUB_OUTPUT"

name: Activate Unity Personal License
description: >
  Activates a Unity Personal license for use in CI.

  On Linux/Windows this activates live using the classic Editor flags
  `-serial -username -password`, following game-ci/unity-builder's approach
  (https://github.com/game-ci/unity-builder/blob/main/dist/platforms/ubuntu/steps/activate.sh).

  On macOS, that same Editor-IPC flow reliably times out waiting for
  ULFActivationResponse (a known, unresolved issue — the Editor's legacy ULF
  activation round-trip to the Unity Licensing Client appears broken on
  ephemeral macOS runners; see game-ci/unity-builder#690, #572). Instead, this
  invokes Unity's standalone `Unity.Licensing.Client` binary directly with
  `--activate-ulf`, bypassing the Editor entirely, following the approach in
  RageAgainstThePixel/unity-cli and buildalon/activate-unity-license, which
  have confirmed-green CI activating Personal licenses on macOS-hosted
  runners.

inputs:
  editor-path:
    description: "Absolute path to the Unity executable to activate"
    required: true
  serial:
    description: "Unity Personal-tier serial"
    required: true
  username:
    description: "Unity ID email"
    required: true
  password:
    description: "Unity ID password"
    required: true

runs:
  using: composite
  steps:
    # https://github.com/game-ci/unity-builder/blob/main/dist/platforms/ubuntu/steps/activate.sh
    - name: Activate Unity Personal license (serial, Linux/Windows)
      if: runner.os != 'macOS'
      shell: bash
      env:
        UNITY_SERIAL: ${{ inputs.serial }}
        UNITY_EMAIL: ${{ inputs.username }}
        UNITY_PASSWORD: ${{ inputs.password }}
      run: |
        mkdir -p /tmp/blank-project/Assets
        attempt=1
        delay=15
        until "${{ inputs.editor-path }}" \
          -logFile - \
          -quit \
          -serial "$UNITY_SERIAL" \
          -username "$UNITY_EMAIL" \
          -password "$UNITY_PASSWORD" \
          -projectPath /tmp/blank-project \
          -batchmode -nographics
        do
          if [ "$attempt" -ge 5 ]; then
            echo "License activation failed after $attempt attempts" >&2
            exit 1
          fi
          echo "Activation attempt $attempt failed, retrying in ${delay}s..."
          sleep "$delay"
          delay=$((delay * 2))
          attempt=$((attempt + 1))
        done

    # https://github.com/RageAgainstThePixel/unity-cli/blob/main/src/license-client.ts
    - name: Activate Unity Personal license (Unity.Licensing.Client, macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        UNITY_SERIAL: ${{ inputs.serial }}
        UNITY_EMAIL: ${{ inputs.username }}
        UNITY_PASSWORD: ${{ inputs.password }}
      run: |
        licensing_client=$(find "$HOME/Library/Application Support/UnityHub" /Applications/"Unity Hub.app" -type f -name "Unity.Licensing.Client" 2>/dev/null | head -1)
        if [ -z "$licensing_client" ]; then
          echo "Could not find the Unity.Licensing.Client executable" >&2
          exit 1
        fi
        echo "Using licensing client: $licensing_client"

        "$licensing_client" \
          --activate-ulf \
          --username "$UNITY_EMAIL" \
          --password "$UNITY_PASSWORD" \
          --serial "$UNITY_SERIAL" \
          --include-personal

        "$licensing_client" --showEntitlements

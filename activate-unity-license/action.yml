name: Activate Unity Personal License
description: >
  Activates a Unity Personal license for use in CI. On Linux/Windows this
  activates live using the classic Editor flags `-serial -username -password`,
  following game-ci/unity-builder's approach
  (https://github.com/game-ci/unity-builder/blob/main/dist/platforms/ubuntu/steps/activate.sh).
  On macOS, live serial activation over the Unity Licensing Client IPC channel
  is unreliable in CI (the ULF activation request reliably times out after
  entitlement activation succeeds), so instead a pre-activated `.ulf` license
  file is decoded from `license-ulf` and placed directly where Unity expects
  it, skipping the live activation round-trip entirely.

inputs:
  editor-path:
    description: "Absolute path to the Unity executable to activate"
    required: true
  serial:
    description: "Unity Personal-tier serial (used on Linux/Windows)"
    required: false
  username:
    description: "Unity ID email (used on Linux/Windows)"
    required: false
  password:
    description: "Unity ID password (used on Linux/Windows)"
    required: false
  license-ulf:
    description: >
      Base64-encoded contents of an already-activated Unity_lic.ulf file
      (used on macOS). Obtain this once by activating Unity manually
      (e.g. `unity -createManualActivationFile`, then activate the resulting
      .alf on https://license.unity3d.com and use the returned .ulf), then
      `base64 -i Unity_lic.ulf | pbcopy` and store it as a secret.
    required: false

runs:
  using: composite
  steps:
    # https://github.com/game-ci/unity-builder/blob/main/dist/platforms/ubuntu/steps/activate.sh
    - name: Activate Unity Personal license (serial, Linux/Windows)
      if: runner.os != 'macOS'
      shell: bash
      env:
        UNITY_SERIAL: ${{ inputs.serial }}
        UNITY_EMAIL: ${{ inputs.username }}
        UNITY_PASSWORD: ${{ inputs.password }}
      run: |
        if [ -z "$UNITY_SERIAL" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
          echo "serial, username, and password inputs are required on $RUNNER_OS" >&2
          exit 1
        fi
        mkdir -p /tmp/blank-project/Assets
        attempt=1
        delay=15
        until "${{ inputs.editor-path }}" \
          -logFile - \
          -quit \
          -serial "$UNITY_SERIAL" \
          -username "$UNITY_EMAIL" \
          -password "$UNITY_PASSWORD" \
          -projectPath /tmp/blank-project \
          -batchmode -nographics
        do
          if [ "$attempt" -ge 5 ]; then
            echo "License activation failed after $attempt attempts" >&2
            exit 1
          fi
          echo "Activation attempt $attempt failed, retrying in ${delay}s..."
          sleep "$delay"
          delay=$((delay * 2))
          attempt=$((attempt + 1))
        done

    - name: Activate Unity Personal license (ulf placement, macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        UNITY_LICENSE_ULF: ${{ inputs.license-ulf }}
      run: |
        if [ -z "$UNITY_LICENSE_ULF" ]; then
          echo "license-ulf input is required on macOS" >&2
          exit 1
        fi
        sudo mkdir -p "/Library/Application Support/Unity"
        echo "$UNITY_LICENSE_ULF" | base64 --decode | sudo tee "/Library/Application Support/Unity/Unity_lic.ulf" > /dev/null
        sudo chmod 666 "/Library/Application Support/Unity/Unity_lic.ulf"
